name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_typecheck:
        description: "Skip the TypeScript check and only run the build"
        type: boolean
        default: false

permissions:
  contents: read

# Cancel an in-flight run when a newer commit arrives on the same ref,
# so a branch that is pushed to repeatedly does not pile up runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # npm ci installs strictly from package-lock.json and fails if the
      # lockfile and package.json disagree. That strictness is deliberate.
      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        if: ${{ inputs.skip_typecheck != true }}
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
